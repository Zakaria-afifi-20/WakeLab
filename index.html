    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" role="document">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Ajouter une activité</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="ajouterForm">
                        <div class="form-row">
                            <div class="col-md-12 mb-1">
                                <label for="validationServer01">Titre :</label>
                                <input type="text" class="form-control " id="titre" placeholder="Titre" required>
                                <!-- <div class="valid-feedback">
                                    Looks good!
                                </div> -->
                            </div>
                            <div class="col-md-12 mb-1">
                                <label for="themeselecte">Theme :</label>
                                <select class="custom-select my-1 mr-sm-2" id="themeselecte">
                                    <option selected>Theme</option>
                                    <option value="jeu">jeu</option>
                                    <option value="apprentissage">apprentissage</option>
                                    <option value="exercice ">exercice</option>
                                    <option value="autre">autre</option>
                                </select>
                            </div>
                            <!--<div class="valid-feedback">
                                    Looks good!
                                </div>-->
                            <div class="col-md-12 mb-1">
                                <label for="validationServer02">Objectifs :</label>
                                <input type="text" class="form-control " id="objectif" placeholder="Objectifs" required>
                                <!-- <div class="valid-feedback">
                                    Looks good!
                                </div> -->
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col-md-12 mb-1">
                                <label for="validationServer03">Duree :</label>
                                <input type="text" class="form-control " id="duree" placeholder="Duree" required>
                                <!-- <div class="invalid-feedback">
                                    Please provide a valid city.
                                </div> -->
                            </div>
                            <div class="col-md-12 mb-1">
                                <label for="validationServer04">Description :</label>
                                <textarea class="form-control" aria-label="With textarea" id="description"
                                    placeholder="Description" required></textarea>

                                <!-- <div class="invalid-feedback">
                                    Please provide a valid state. ----is-invalid
                                </div> -->
                            </div>
                        </div>
                        <div class="form-group">

                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" id="btnfermer">Fermer</button>
                    <button type="button" class="btn btn-primary" id="btnajouter">Ajouter</button>
                    <!-- <div class="valid-feedback">
                                    Please provide a valid zip.
                                </div> -->
                </div>
            </div>
        </div>
    </div>
